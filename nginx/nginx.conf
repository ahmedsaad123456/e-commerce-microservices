events {}

http {

    upstream gateways {

        # Default load balancing algorithm: Round Robin.
        server gateway-1:8222;
        server gateway-2:8222;

        # Uncomment to use Least Connections instead.
        # least_conn;
    }

    server {
        # Block external access to Actuator endpoints.
        location /actuator/ {
            return 404;
        }

        listen 80;

        location / {

            proxy_pass http://gateways;

            # Preserve the original host.
            proxy_set_header Host $host;

            # Forward the client IP address.
            proxy_set_header X-Real-IP $remote_addr;

            # Overwrite this header to prevent client IP spoofing.
            proxy_set_header X-Forwarded-For $remote_addr;

            # Forward the original request protocol.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry another gateway on connection errors or timeouts.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}