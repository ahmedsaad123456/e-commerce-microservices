
# ---------------------------------------------------------------
# Served by the Config Server to the app named "product-service".
# This file is packaged inside the config-server jar.
# ---------------------------------------------------------------

server:
  port: 8050

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/product_db
    username: product_user
    password: ${PRODUCT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: kafka:19092
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
    producer:
      acks: all

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # The service is ready only when PostgreSQL is available.
          include: readinessState,db
