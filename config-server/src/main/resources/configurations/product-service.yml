
# ---------------------------------------------------------------
# Served by the Config Server to the app named "product-service".
# This file is packaged inside the config-server jar.
# ---------------------------------------------------------------

server:
  port: 8050

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/product_db
    username: product_user
    password: ${PRODUCT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          # What we EXPECT to find in the "iss" claim. It is only compared as a string.
          issuer-uri: http://localhost:8180/realms/ecommerce
          # Where to download the public keys from. Inside docker we reach Keycloak by its container name.
          jwk-set-uri: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: kafka:19092
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # The service is ready only when PostgreSQL is available.
          include: readinessState,db
