# ---------------------------------------------------------------
# docker-compose.yaml
# Describes HOW to build and run all containers (infrastructure level):
# images, ports, networks, startup order, env variables, volumes.
# It does not contain application logic settings (those are in Config Server).
# ---------------------------------------------------------------
services:                                 # List of containers to run

  config-server:                          # Service name = DNS name other containers use ("config-server")
    build: ./config-server
    ports:                                # Publish ports: "HOST:CONTAINER"
      - "8888:8888"                       # localhost:8888 on your PC -> port 8888 in the container
    networks:                             # Networks this container joins
      - microservices-net                 # Shared network so containers can reach each other by name
    healthcheck:                          # Docker periodically checks if the app is really ready
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s                       # Run the check every 10 seconds
      timeout: 5s                         # Fail the check if it takes longer than 5 seconds
      retries: 10                         # Mark "unhealthy" after 10 consecutive failures

  eureka-server:                          # Discovery server container (DNS name "eureka-server")
    build: ./discovery-service
    ports:
      - "8761:8761"                       # Eureka dashboard: http://localhost:8761
    depends_on:                           # Startup order
      config-server:                      # Needs the Config Server first (to read its config)
        condition: service_healthy        # Wait until config-server's healthcheck passes
    networks:                             # Networks this container joins
      - microservices-net                 # Same shared network

  customer-service:                       # Customer microservice container
    build: ./customer-service             # Build from the Dockerfile in ./customer-service
    ports:
      - "8090:8090"                       # Host 8090 -> container 8090 (must match server.port)
    environment:                          # OS environment variables inside the container
      # These feed the ${MONGO_USER}, ${MONGO_PASSWORD} placeholders
      # in customer-service.yml. The values come from your local .env file.
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    depends_on:                           # Startup order
      config-server:                      # Needs configuration first
        condition: service_healthy        # Wait until the Config Server is healthy
      eureka-server:                      # Needs the registry to register in
        condition: service_started        # Only waits for the container to start, NOT for Eureka to be ready
      mongo:                              # Needs the database
        condition: service_healthy        # Wait until Mongo's healthcheck passes
    networks:                             # Networks this container joins
      - microservices-net                 # Same shared network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8090/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s     # grace period: Spring Boot needs time to start, failures here are ignored

  product-service:                        # Product microservice container (PostgreSQL + Flyway + Redis)
    build: ./product-service              # Build from the Dockerfile in ./product-service
    ports:
      - "8091:8050"                       # Host 8091 -> container 8050 (must match server.port in product-service.yml)
    environment:                          # OS environment variables inside the container
      # These feed the ${...} placeholders in product-service.yml.
      # The values come from your local .env file.
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # Redis password (spring.data.redis.password)
    depends_on:                           # Startup order
      config-server:                      # Needs configuration first
        condition: service_healthy        # Wait until the Config Server is healthy
      eureka-server:                      # Needs the registry to register in
        condition: service_started        # Only waits for the container to start
      postgres:                           # Flyway runs migrations at startup, so the DB must be ready
        condition: service_healthy        # Wait until Postgres accepts connections
      redis:                              # Needs the cache
        condition: service_healthy        # Wait until Redis answers PING
    networks:                             # Networks this container joins
      - microservices-net                 # Same shared network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8050/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s     # grace period: Spring Boot + Flyway migrations need time to start

  order-service:
    build: ./order-service              # Build from the Dockerfile in ./order-service
    ports:
      - "8070:8070"
    environment:
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on: # Startup order
      config-server: # Needs configuration first
        condition: service_healthy        # Wait until the Config Server is healthy
      eureka-server: # Needs the registry to register in
        condition: service_started        # Only waits for the container to start
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres: # Flyway runs migrations at startup, so the DB must be ready
        condition: service_healthy        # Wait until Postgres accepts connections
    networks: # Networks this container joins
      - microservices-net                 # Same shared network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8070/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s     # grace period: Spring Boot + Flyway migrations need time to start

  payment-service:
    build: ./payment-service              # Build from the Dockerfile in ./payment-service
    ports:
      - "8060:8060"
    environment:
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on: # Startup order
      config-server: # Needs configuration first
        condition: service_healthy        # Wait until the Config Server is healthy
      eureka-server: # Needs the registry to register in
        condition: service_started        # Only waits for the container to start
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres: # Flyway runs migrations at startup, so the DB must be ready
        condition: service_healthy        # Wait until Postgres accepts connections
    networks: # Networks this container joins
      - microservices-net                 # Same shared network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8060/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s     # grace period: Spring Boot + Flyway migrations need time to start

  notification-service: # notification microservice container
    build: ./notification-service             # Build from the Dockerfile in ./notification-service
    ports:
      - "8040:8040"                       # Host 8090 -> container 8090 (must match server.port)
    environment: # OS environment variables inside the container
      # These feed the ${MONGO_USER}, ${MONGO_PASSWORD} placeholders
      # in notification-service.yml. The values come from your local .env file.
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on: # Startup order
      config-server: # Needs configuration first
        condition: service_healthy        # Wait until the Config Server is healthy
      eureka-server: # Needs the registry to register in
        condition: service_started        # Only waits for the container to start, NOT for Eureka to be ready
      mongo: # Needs the database
        condition: service_healthy        # Wait until Mongo's healthcheck passes
      rabbitmq:
        condition: service_healthy
      mail-dev:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks: # Networks this container joins
      - microservices-net                 # Same shared network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8040/actuator/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s     # grace period: Spring Boot needs time to start, failures here are ignored

  postgres:
    image: postgres:16
    container_name: e_commerce_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}      # used by the init script
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/data/postgres
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - microservices-net
    restart: unless-stopped
    healthcheck:                          # needed so "service_healthy" works for product-service
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - microservices-net
    restart: unless-stopped

  redis:                                  # Redis cache (DNS name "redis")
    image: redis:7                        # Official Redis image, version 7
    container_name: ecommerce-redis       # Fixed container name
    restart: unless-stopped               # Restart automatically unless stopped manually
    command: redis-server --requirepass ${REDIS_PASSWORD} # Require a password for every connection
    ports:
      - "${REDIS_PORT}:6379"              # HOST port from .env -> Redis default port 6379 (container side stays 6379)
    volumes:
      - redis_data:/data                  # Keep Redis snapshots so cached data survives restarts
    networks:
      - microservices-net
    healthcheck:                          # Check that Redis really answers
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:                        # Web UI for Redis (the equivalent of mongo-express)
    image: rediscommander/redis-commander:latest
    container_name: redis_commander
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    environment:
      # Format: label:host:port:dbIndex:password  (avoid ":" inside the password)
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_COMMANDER_USERNAME}     # Username to open the web UI
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD} # Password to open the web UI
    depends_on:
      redis:
        condition: service_healthy        # Wait until Redis is healthy
    networks:
      - microservices-net

  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - microservices-net
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_USER}",
          "--password",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - microservices-net


  kafka:
    # Official Apache Kafka image (KRaft mode)
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      # host:container. For tools on YOUR machine (IDE, CLI, Spring app run locally).
      # Containers in the same compose file use kafka:19092 instead.
      - "9092:9092"
    networks:
      - microservices-net
    environment:

      # ---- KRaft: how the cluster manages itself ----
      # Node is the Broker here
      KAFKA_NODE_ID: 1                              # unique id of this node in the cluster
      KAFKA_PROCESS_ROLES: broker,controller        # one node plays both roles (fine for development)
      #   broker     = stores messages, serves clients
      #   controller = manages metadata (partition leaders, topics)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # controllers that vote: <node-id>@<host>:<port>
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER   # which listener name is used for controller traffic

      # ---- Listeners: three doors into the same broker ----
      # What the broker actually LISTENS on (0.0.0.0 = all network interfaces):
      #   INTERNAL   19092 -> other containers (e.g. kafka-ui)
      #   EXTERNAL   9092  -> your machine (IDE, CLI, local Spring app)
      #   CONTROLLER 9093  -> controller traffic only (not exposed to the host)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # What the broker TELLS clients to use when they connect again after the first contact.
      # If INTERNAL advertised "localhost", a container would call itself and fail.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      # Which security protocol each listener uses (PLAINTEXT = no encryption, dev only)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Brokers talk to each other over this listener (matters when you have more than one broker)
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # ---- Single node settings ----
      # Single node: the internal topics cannot be replicated 3 times, so tell Kafka 1 is enough
      # the number the copies of the partitions (means the number of the brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1            # copies of __consumer_offsets (consumer positions)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1    # copies of __transaction_state
      # min number of in-sync replicas (copies of the partition, leader included)
      # that must have the write before it is acknowledged
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0            # don't wait before assigning partitions to the first consumers (faster dev)
    volumes:
      # Keep messages and topics on the host so they survive container restarts
      # (`docker compose down -v` deletes this volume)
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Healthy when Kafka answers a "list topics" request from inside the container
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 10s        # run the check every 10 seconds
      timeout: 10s         # a single check fails if it takes longer than this
      retries: 10          # unhealthy after 10 failed checks in a row
      start_period: 20s    # failures during the first 20s don't count (Kafka is still starting)

  kafka-ui:
    # Web UI to browse topics, messages, and consumer groups
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8095:8080"            # open http://localhost:8095 (8080 is probably taken on your machine)
    networks:
      - microservices-net
    environment:
      KAFKA_CLUSTERS_0_NAME: local                      # cluster name shown in the UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092    # UI is a container, so it uses the INTERNAL door
    depends_on:
      kafka:
        condition: service_healthy    # start the UI only after Kafka is healthy

  rabbitmq:
    image: rabbitmq:4-management          # the "-management" image includes the web UI
    container_name: rabbitmq
    hostname: rabbitmq                    # RabbitMQ keeps its data in a folder named after the hostname: a fixed hostname keeps the data when the container is recreated
    ports:
      - "5672:5672"                       # AMQP: what Spring uses
      - "15672:15672"                     # management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - microservices-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mail-dev:
    networks:
      - microservices-net
    container_name: ms-mail-dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"


networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  pgadmin:
  redis_data:
  kafka-data:
  rabbitmq-data: